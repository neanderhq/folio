services:
  web:
    build:
      context: ..
      dockerfile: .neander/Dockerfile
    ports: ["8080:8080"]
    secrets: [neander_environment]
    x-google-cloudrun:
      ingress-container: true
secrets:
  neander_environment:
    file: /run/neander/secrets/neander_environment
x-neander:
  ingress:
    service: web
    port: 8080
    root_probe: /api/health
  environment:
    - service: web
      name: DATABASE_URL
      required: true
      source: provisioned
      provider: Neon
    - service: web
      name: FOLIO_GOOGLE_CLIENT_ID
      required: false
      source: user
      provider: null
    - service: web
      name: FOLIO_GOOGLE_CLIENT_SECRET
      required: false
      source: user
      provider: null
    - service: web
      name: FOLIO_GOOGLE_REDIRECT_URI
      required: false
      source: user
      provider: null
    - service: web
      name: FOLIO_MAIL_ENCRYPTION_KEY
      required: false
      source: user
      provider: null
  probes:
    - path: /api/health
      success_status_range: 2xx
  migration: nextjs-drizzle
